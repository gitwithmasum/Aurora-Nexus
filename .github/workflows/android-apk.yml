name: Build Aurora Nexus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install

      - name: Generate Android app icons
        run: |
          npx -y @capacitor/assets generate \
            --android \
            --assetPath resources

      - name: Sync Capacitor Android
        run: |
          npx cap sync android


      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Compile Android Java
        working-directory: android
        run: |
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Build Aurora Nexus APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Aurora Nexus APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Nexus-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
